  <text x="696" y="36" fill="#59636E" font-family="'Segoe UI',-apple-system,sans-serif" font-size="11.5" font-weight="500" text-anchor="end">Let’s turn ideas into robust reality</text>

  <!-- Card 1: Aspiring Software Dev & Tech Excellence -->
  <rect x="24" y="56" width="214" height="92" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <text x="38" y="78" font-size="15">💻</text>
  <text x="62" y="77" fill="#0969DA" font-family="'Segoe UI',-apple-system,sans-serif" font-size="10.5" font-weight="800" letter-spacing="1">SOFTWARE DEV</text>
  <text x="38" y="99" fill="#1F2328" font-family="'Segoe UI',-apple-system,sans-serif" font-size="12" font-weight="700">Tech Excellence</text>
  <text x="38" y="117" fill="#59636E" font-family="'Segoe UI',-apple-system,sans-serif" font-size="10.5">Java · Python · Full-Stack</text>
  <text x="38" y="132" fill="#59636E" font-family="'Segoe UI',-apple-system,sans-serif" font-size="10.5">Scalable backends &amp; clean code</text>

  <!-- Card 2: Explore New Tech -->
  <rect x="253" y="56" width="214" height="92" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>

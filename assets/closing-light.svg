  <circle cx="36" cy="32" r="4.5" fill="#1A7F37">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="36" fill="#1A7F37" font-family="'Segoe UI',-apple-system,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">OPEN FOR COLLABORATION</text>


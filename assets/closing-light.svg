<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 165" width="720" height="165" role="img">
  <rect x="1" y="1" width="718" height="163" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
  
  <!-- Gradient top accent bar -->
  <rect x="1" y="1" width="180" height="3" rx="1.5" fill="#1A7F37"/>
  <rect x="181" y="1" width="180" height="3" rx="1.5" fill="#0969DA"/>
  <rect x="361" y="1" width="180" height="3" rx="1.5" fill="#8250DF"/>
  <rect x="541" y="1" width="178" height="3" rx="1.5" fill="#BC4C00"/>


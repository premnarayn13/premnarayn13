  <text x="291" y="77" fill="#8250DF" font-family="'Segoe UI',-apple-system,sans-serif" font-size="10.5" font-weight="800" letter-spacing="1">INNOVATION</text>
  <text x="267" y="99" fill="#1F2328" font-family="'Segoe UI',-apple-system,sans-serif" font-size="12" font-weight="700">Exploring Frontier Tech</text>
  <text x="267" y="117" fill="#59636E" font-family="'Segoe UI',-apple-system,sans-serif" font-size="10.5">Agentic workflows · RAG · ML</text>
